<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全审计平台 · 安全基线库</title>
  <!-- ✅【固定对接区】Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 🟡【可修改美化区】自定义样式占位 -->
  <style>
    @media print { /* 报告页专用占位 */ }
    .nav-item { padding: .75rem 1rem; border-radius: .375rem; color: #d1d5db; }
    .nav-item:hover { background: #374151; }
    .nav-item.active { background: #0891b2; color: #fff; }    .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; color: #fff; }
    .risk-high { background: #ef4444; }
    .risk-mid  { background: #f59e0b; }
    .risk-low  { background: #3b82f6; }

  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex">

  <!-- ✅【固定对接区】公共侧边栏（所有页面复用） -->
  <aside class="w-64 bg-gray-800 border-r border-gray-700 flex-shrink-0">
    <div class="p-4 border-b border-gray-700">
      <h1 class="text-xl font-bold text-cyan-400">🛡️ 安全审计平台</h1>
    </div>
    <nav class="p-2 text-sm flex flex-col gap-1">
      <a href="index.html" class="nav-item">📊 仪表盘</a>
      <a href="scan.html" class="nav-item">🔍 审计任务</a>
      <a href="baseline.html" class="nav-item active">📋 安全基线库</a>
      <a href="report.html" class="nav-item">📑 审计报告</a>
      <a href="help.html" class="nav-item">❓ 帮助/关于</a>
    </nav>
  </aside>

  <!-- 主内容区 -->
  <main class="flex-1 p-6 overflow-auto">
    <!-- 🟡【可修改美化区】标题 -->
    <header class="mb-6">
      <h2 class="text-2xl font-bold">安全基线库</h2>
      <p class="text-gray-400 text-sm mt-1">管理系统安全基线规则</p>
    </header>

    <!-- ✅【固定对接区】搜索栏 -->
    <div class="bg-gray-800 rounded-lg p-4 mb-4 flex gap-3 items-center">
      <input id="baseline-search-input" type="text"
        placeholder="搜索基线规则名称 / 编号..."
        class="flex-1 bg-gray-700 border border-gray-600 rounded px-4 py-2 focus:outline-none focus:border-cyan-500" />
      <!-- 后续绑定：input → 前端过滤 + 后端搜索 -->
      <button class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded">🔎 搜索</button>
      <!-- 🟡 可修改美化区：后续可加"新增基线""导入导出"按钮 -->
    </div>

    <!-- ✅【固定对接区】基线列表容器 -->
    <div id="baseline-container"
      class="bg-gray-800 rounded-lg p-4 divide-y divide-gray-700">
      <!-- 📌【待填充数据区】动态渲染卡片 / 列表，不放假数据 -->
      <div class="text-center text-gray-500 py-10">
        <!-- 降级提示占位 -->
        <p>暂无基线数据，请从基线库接口加载</p>
        <p class="text-xs mt-1 text-gray-600">（如果后端不可用，将显示此提示）</p>
      </div>
    </div>
  </main>

  <!-- ✅【固定对接区】弹窗根容器 -->
  <div id="modal-container"></div>

  <!-- JS 挂载区：基线列表加载 / 搜索过滤 / 降级处理 -->
<script src="../js/ui/storage.js"></script>
<script type="module" src="baseline-app.js"></script>
</body>
</html>

<!-- =========================
  📌 本页面对接清单 · 安全基线库
  =========================
  包含 ID:
    • baseline-search-input — 搜索框
    • baseline-container    — 基线列表主容器
    • modal-container        — 弹窗根（新增/编辑基线）
  适合 JS 模块:
    • GET /api/baselines → 列表渲染
    • 搜索过滤（前端 debounce 或后端接口）
    • 新增 / 编辑 / 删除 基线 CRUD
  ========================= -->
