<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全审计平台 · 审计任务</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print { }
    .nav-item { padding: .75rem 1rem; border-radius: .375rem; color: #d1d5db; }
    .nav-item:hover { background: #374151; }
    .nav-item.active { background: #0891b2; color: #fff; }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; color: #fff; }
    .risk-high { background: #ef4444; }
    .risk-mid  { background: #f59e0b; }
    .risk-low  { background: #3b82f6; }
    .btn-mini { padding: 2px 10px; font-size: 12px; border-radius: 4px; background: #0891b2; color: #fff; border: none; cursor: pointer; }
    .btn-mini:hover { background: #0e7490; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex">

  <aside class="w-64 bg-gray-800 border-r border-gray-700 flex-shrink-0">
    <div class="p-4 border-b border-gray-700">
      <h1 class="text-xl font-bold text-cyan-400">🛡️ 安全审计平台</h1>
    </div>
    <nav class="p-2 text-sm flex flex-col gap-1">
      <a href="index.html" class="nav-item">📊 仪表盘</a>
      <a href="scan.html" class="nav-item active">🔍 审计任务</a>
      <a href="baseline.html" class="nav-item">📋 安全基线库</a>
      <a href="report.html" class="nav-item">📑 审计报告</a>
      <a href="help.html" class="nav-item">❓ 帮助/关于</a>
    </nav>
  </aside>

  <main class="flex-1 p-6 overflow-auto">
    <!-- 🟡 标题 + 后端状态 + 登录 -->
    <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h2 class="text-2xl font-bold">审计任务</h2>
        <p class="text-gray-400 text-sm mt-1">上传文件 · 启动扫描 · 查看结果</p>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <span id="connection-status" class="px-2 py-1 rounded bg-yellow-900/50 text-yellow-300 text-xs">检查中...</span>
        <span id="auth-status" class="text-gray-400 text-xs">未登录</span>
        <button id="login-open-btn" class="text-xs bg-cyan-700 hover:bg-cyan-600 text-white px-3 py-1 rounded">登录 / 注册</button>
        <button id="logout-btn" class="hidden text-xs bg-gray-700 hover:bg-red-700 text-gray-200 px-3 py-1 rounded">退出登录</button>
      </div>
    </header>

    <!-- ① 上传扫描 -->
    <section class="bg-gray-800 rounded-lg p-6 mb-6">
      <h3 class="font-semibold mb-4">① 选择扫描文件</h3>

      <!-- 🆕 drop-zone + 示例按钮 -->
      <div id="drop-zone" class="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center mb-4 transition-colors">
        <input id="upload-file-input" type="file" class="hidden" multiple accept=".txt,.log,.html,.json,.pcap,.conf,.ini,.py,.yml,.yaml,.cfg,.sh,.js" />
        <p class="text-gray-400 mb-3">拖拽文件到此处，或点击下方按钮选择</p>
        <div class="flex gap-3 justify-center flex-wrap">
          <button id="scan-start-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-2 rounded font-semibold">
            📂 选择文件并开始扫描
          </button>
          <button id="scan-sample-btn" class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-2 rounded font-semibold">
            🎯 示例扫描（sshd_bad.conf）
          </button>
        </div>
      </div>

      <!-- 进度条 -->
      <div class="mb-2">
        <div class="bg-gray-700 rounded-full h-3 overflow-hidden">
          <div id="scan-progress-bar" class="h-full bg-cyan-500 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
      <p id="scan-status-tip" class="text-gray-400 text-sm text-center">待开始...</p>
      <div id="scan-save-status" class="text-xs text-center mt-2 text-gray-500"></div>
      <p id="result-summary" class="text-sm text-gray-300 text-center mt-2 hidden"></p>
    </section>

    <!-- ② 扫描结果 -->
    <section class="bg-gray-800 rounded-lg p-6">
      <h3 class="font-semibold mb-4">② 扫描结果</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-700 text-gray-300">
            <tr>
              <th class="px-4 py-2 text-left">#</th>
              <th class="px-4 py-2 text-left">漏洞名称</th>
              <th class="px-4 py-2 text-left">风险等级</th>
              <th class="px-4 py-2 text-left">位置</th>
              <th class="px-4 py-2 text-left">描述</th>
              <th class="px-4 py-2 text-left">操作</th>
            </tr>
          </thead>
          <tbody id="result-table-body">
            <tr><td colspan="6" class="text-center text-gray-500 py-6">暂无扫描结果，请先上传文件</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 🆕 ③ 历史记录 -->
    <section class="bg-gray-800 rounded-lg p-6 mt-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold">③ 历史审计记录</h3>
        <button id="history-refresh-btn" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1 rounded">🔄 刷新</button>
      </div>
      <div id="history-list" class="flex flex-col gap-3">
        <p class="text-gray-500 text-sm text-center py-6">暂无历史记录，先扫描一个文件试试</p>
      </div>
    </section>
  </main>

  <!-- 弹窗根 -->
  <div id="modal-container"></div>

  <!-- 🆕 登录/注册弹窗 -->
  <div id="auth-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-gray-800 rounded-lg w-full max-w-md p-6 relative">
      <button id="auth-close" class="absolute top-3 right-3 text-gray-400 hover:text-white text-xl">✕</button>
      <h3 id="auth-title" class="text-lg font-semibold mb-4">登录</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">用户名</label>
          <input id="auth-username" type="text" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">密码</label>
          <input id="auth-password" type="password" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <div id="auth-error" class="hidden text-red-400 text-xs bg-red-900/30 border border-red-700 rounded p-2"></div>
        <button id="auth-submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-2 rounded font-semibold">登录</button>
        <p class="text-xs text-center text-gray-400">
          <span id="auth-switch-tip">还没有账号？</span>
          <button id="auth-switch" class="text-cyan-400 hover:underline ml-1">去注册</button>
        </p>
      </div>
    </div>
  </div>

  <!-- 📦 JS：先 storage.js，再队友的 scan-page.js -->
<script src="../js/ui/storage.js"></script>
<script src="../js/ui/modal.js"></script>
<script type="module" src="../js/pages/scan-page.js"></script>
</body>
</html>
