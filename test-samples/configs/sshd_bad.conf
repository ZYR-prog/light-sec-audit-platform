# 存在多个高危配置项的 sshd_config 样例（用于验证扫描器能否正确检出）
Port 22
AddressFamily any
ListenAddress 0.0.0.0

# 下面是历史配置，已废弃（扫描器不应把它算作漏洞）
#PasswordAuthentication yes

PasswordAuthentication yes
PermitRootLogin yes
PermitEmptyPasswords yes
PermitEmptyPasswords no
X11Forwarding no

MaxAuthTries 6
ClientAliveInterval 300
